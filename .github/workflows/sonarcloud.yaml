name: SonarCloud SAST

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    # Skip fork PRs because they should not access GCP credentials or secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud using WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: projects/7357563199/locations/global/workloadIdentityPools/github-actions-pool-v2/providers/github-provider-v2
          service_account: github-actions-ci@k8s-learning-510807.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Read SonarCloud token from Secret Manager
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SECRET_ID: sonarcloud-token
        run: |
          set -euo pipefail
          token="$(gcloud secrets versions access latest \
            --secret="$SECRET_ID" \
            --project="$PROJECT_ID")"
          test -n "$token"
          echo "::add-mask::$token"
          echo "SONAR_TOKEN=$token" >> "$GITHUB_ENV"

      - name: SonarCloud scan and quality gate
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
name: Validate

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'helm/**'
      - '.github/workflows/**'
      - 'sonar-project.properties'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'helm/**'
      - '.github/workflows/**'
      - 'sonar-project.properties'

permissions:
  contents: read
  id-token: write

jobs:
  wif-check:
    name: Verify Google Cloud WIF
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate using Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: k8s-learning-510807
          workload_identity_provider: projects/7357563199/locations/global/workloadIdentityPools/github-actions-pool-v2/providers/github-provider-v2
          service_account: github-actions-ci@k8s-learning-510807.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify authentication
        run: |
          gcloud auth list
          gcloud config get-value project
          echo "WIF authentication succeeded."

  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [product-api, order-api]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/${{ matrix.app }}/requirements-dev.txt
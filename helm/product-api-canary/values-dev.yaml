replicaCount: 1
nameOverride: "product-api-canary"
image:
  repository: us-central1-docker.pkg.dev/k8s-learning-510807/gitops-apps/product-api
  tag: "product-api-v1.2"
  pullPolicy: IfNotPresent


podDisruptionBudget:
  enabled: false

configMap:
  create: true
  name: "product-api-canary-config"
  data:
    DB_HOST: "postgres"
    DB_PORT: "5432"
    DB_NAME: "ecommerce"

secret:
  existingSecret: "postgres-credentials"
  env: []
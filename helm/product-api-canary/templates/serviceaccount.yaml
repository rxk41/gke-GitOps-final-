{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "serviceAccount.gcpServiceAccountEmail must be set to the GKE workload Google service account email" .Values.serviceAccount.gcpServiceAccountEmail | quote }}
{{- end }}

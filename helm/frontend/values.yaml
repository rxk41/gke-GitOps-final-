replicaCount: 2
image:
  repository: REGION-docker.pkg.dev/PROJECT_ID/gitops-apps/frontend
  tag: dev
  pullPolicy: IfNotPresent
service:
  type: LoadBalancer
  port: 80
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Optional non-sensitive environment configuration.
configMap:
  create: true
  name: ""
  data: {}
# Reference an existing Kubernetes Secret; do not put real credentials in values files.
secret:
  existingSecret: ""
  env: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1

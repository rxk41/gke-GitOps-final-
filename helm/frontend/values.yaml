replicaCount: 2
image:
  repository: us-central1-docker.pkg.dev/k8s-learning-510807/gitops-apps/frontend
  tag: "frontend-v1.1"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Optional non-sensitive environment configuration.
configMap:
  create: true
  name: ""
  data: {}
# Reference an existing Kubernetes Secret; do not put real credentials in values files.
secret:
  existingSecret: ""
  env: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1

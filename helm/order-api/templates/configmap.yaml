{{- if .Values.configMap.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ default (printf "%s-config" .Release.Name) .Values.configMap.name }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
{{- if .Values.configMap.data }}
{{ toYaml .Values.configMap.data | indent 2 }}
{{- else }}
  APP_ENV: "development"
{{- end }}
{{- end }}

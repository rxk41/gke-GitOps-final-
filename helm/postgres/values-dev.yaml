
fullnameOverride: postgres

replicaCount: 1

image:
  repository: postgres
  tag: "16"
  pullPolicy: IfNotPresent

service:
  port: 5432

storage:
  size: 5Gi
  storageClassName: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

credentialsSecret: postgres-credentials

podDisruptionBudget:
  enabled: true
  minAvailable: 1

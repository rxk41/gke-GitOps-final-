replicaCount: 1
image:
  repository: postgres
  tag: "16-alpine"
  pullPolicy: IfNotPresent
nameOverride: ""
fullnameOverride: "postgres"
storage:
  size: 5Gi
  storageClassName: "" # Uses the cluster default StorageClass when empty
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
credentialsSecret: postgres-credentials
service:
  port: 5432

# Schedule PostgreSQL only onto the dedicated Terraform node pool.
nodeSelector:
  workload: postgres
tolerations:
  - key: dedicated
    operator: Equal
    value: postgres
    effect: NoSchedule
podDisruptionBudget:
  enabled: true
  minAvailable: 1

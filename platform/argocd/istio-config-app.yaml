
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-store-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/rxk41/gke-GitOps-final-.git
    targetRevision: main
    path: platform/istio
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

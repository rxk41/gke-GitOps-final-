apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: order-api-mtls
  namespace: apps
spec:
  host: order-api.apps.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: frontend-mtls
  namespace: apps
spec:
  host: frontend.apps.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL

apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: store-routing
  namespace: apps
spec:
  hosts:
    - "*"
  gateways:
    - store-gateway
  http:
    - name: product-api
      match:
        - uri:
            prefix: /api/products
      rewrite:
        uri: /products
      route:
        - destination:
            host: product-api.apps.svc.cluster.local
            port:
              number: 80
    - name: order-api
      match:
        - uri:
            prefix: /api/orders
      rewrite:
        uri: /orders
      route:
        - destination:
            host: order-api.apps.svc.cluster.local
            port:
              number: 80
    - name: frontend
      route:
        - destination:
            host: frontend.apps.svc.cluster.local
            port:
              number: 80

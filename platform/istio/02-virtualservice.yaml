apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: store-routing
  namespace: apps
spec:
  hosts:
    - "*"
  gateways:
    - store-gateway
  http:
    - name: order-api
      match:
        - uri:
            prefix: /api/version
      rewrite:
        uri: /version
      route:
        - destination:
            host: order-api.apps.svc.cluster.local
            port:
              number: 8000
          weight: 100

    - name: frontend
      route:
        - destination:
            host: frontend.apps.svc.cluster.local
            port:
              number: 80
          weight: 100
